{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет торможения</title>
    <link rel="icon" href="{% static 'images/logo1_1.png' %}" type="image/x-icon">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2187f4;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        .login-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .username-field, .password-field {
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        form button[type="submit"] {
            background-color: #2187f4;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        form button[type="submit"]:hover {
            background-color: #0d6efd;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Вход в программу для расчета</h2>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" name="username" class="username-field" placeholder="Имя пользователя" required>
            <input type="password" name="password" class="password-field" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        {% if form.errors %}
            <div class="error-message">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}
    </div>
</body>
</html>
